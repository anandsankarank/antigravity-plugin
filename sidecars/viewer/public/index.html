<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A-MDUI Studio</title>
  <link rel="stylesheet" href="./a-mdui.bundle.css">
  <style>
    :root {
      --bg-primary: #18181b;
      --bg-surface: #27272a;
      --bg-input: #3f3f46;
      --border: #3f3f46;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 10px 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      color: var(--accent);
      white-space: nowrap;
    }
    .file-select {
      flex: 1;
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    .btn {
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn:hover {
      background: #52525b;
    }
    .btn.primary {
      background: var(--accent);
      color: #09090b;
      font-weight: 600;
      border: none;
    }
    .btn.primary:hover {
      background: var(--accent-hover);
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    #viewer-container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }
    #raw-editor {
      width: 100%;
      height: 100%;
      min-height: 400px;
      background: #09090b;
      color: #38bdf8;
      font-family: monospace;
      font-size: 13px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      resize: vertical;
      display: none;
    }
    .status-bar {
      padding: 4px 12px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
  <script src="./a-mdui.bundle.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <span>⚡ A-MDUI Studio</span>
    </div>
    <select id="file-select" class="file-select">
      <option value="">Select a .mdui file from workspace...</option>
    </select>
    <button id="toggle-view-btn" class="btn">Raw</button>
    <button id="refresh-btn" class="btn primary">Reload</button>
  </header>

  <main>
    <div id="viewer-container">
      <a-mdui id="viewer"></a-mdui>
    </div>
    <textarea id="raw-editor" spellcheck="false"></textarea>
  </main>

  <footer class="status-bar">
    <span id="active-file-label">No file loaded</span>
    <span>Antigravity Auxiliary Pane</span>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
